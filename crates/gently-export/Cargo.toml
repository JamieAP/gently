[package]
name = "gently-export"
version.workspace = true
edition.workspace = true

[dependencies]
gently-core = { path = "../gently-core" }
gently-store = { path = "../gently-store" }
# http3 enables reqwest's in-process QUIC client (quinn/h3 under the hood).
# Requires --cfg reqwest_unstable (see .cargo/config.toml).
reqwest = { workspace = true, features = ["http3"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
