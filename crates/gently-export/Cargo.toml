[package]
name = "gently-export"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gently-core = { path = "../gently-core" }
gently-store = { path = "../gently-store" }
# http3 enables reqwest's in-process QUIC client (quinn/h3 under the hood).
# Requires --cfg reqwest_unstable (see .cargo/config.toml).
reqwest = { workspace = true, features = ["http3"] }
# The http3 path uses rustls' "no-provider" variant, so a process-default crypto
# provider must be installed explicitly before building the QUIC client.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
