name: release

# Build, checksum, attest and verify release binaries for an existing v* tag:
#   gh workflow run release.yml --repo JamieAP/gently --ref vX.Y.Z
# Publishing the GitHub release from the verified bundle is a separate owner
# step; see docs/guides/releasing.md. No job can write repository contents.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'JamieAP/gently' && startsWith(github.ref, 'refs/tags/v') && github.actor == 'JamieAP' && github.triggering_actor == 'JamieAP'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install stable Rust and record exact versions
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -vV
          cargo --version
          python3 --version
      - name: Check the tag, workspace version, CHANGELOG and build host agree
        run: python3 scripts/release-check.py version --tag "$GITHUB_REF_NAME" --target "${{ matrix.target }}"
      # --config arrays are appended to .cargo/config.toml's rustflags, which
      # RUSTFLAGS would replace (dropping the reqwest_unstable cfg).
      - name: Build without local source paths
        run: |
          cargo build --release --locked --package gently-cli \
            --config "build.rustflags=[\"--remap-path-prefix=$GITHUB_WORKSPACE=/gently\", \"--remap-path-prefix=$HOME/.cargo=/cargo\", \"--remap-path-prefix=$HOME/.rustup=/rustup\"]"
      - name: Package a deterministic archive
        run: python3 scripts/release-check.py package --tag "$GITHUB_REF_NAME" --target "${{ matrix.target }}" --binary target/release/gently --out dist --forbid "$GITHUB_WORKSPACE" --forbid "$HOME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gently-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  attest:
    if: github.repository == 'JamieAP/gently' && startsWith(github.ref, 'refs/tags/v') && github.actor == 'JamieAP' && github.triggering_actor == 'JamieAP'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gently-*
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: |
          sha256sum gently-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  verify:
    if: github.repository == 'JamieAP/gently' && startsWith(github.ref, 'refs/tags/v') && github.actor == 'JamieAP' && github.triggering_actor == 'JamieAP'
    needs: attest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_WRITE_LOGS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Record exact build tool versions
        run: |
          rustc --version
          cargo --version
          node --version
          npm --version
          python3 --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify "dist/gently-${GITHUB_REF_NAME#v}-${{ matrix.target }}.tar.gz" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref "$GITHUB_REF"
      - name: Install from the checksummed archive
        run: python3 scripts/release-check.py install --tag "$GITHUB_REF_NAME" --target "${{ matrix.target }}" --dist dist --dest "$RUNNER_TEMP/release"
      - name: Build the previous version from source
        run: |
          previous=$(python3 scripts/release-check.py previous --tag "$GITHUB_REF_NAME")
          git worktree add --detach "$RUNNER_TEMP/previous-src" "$previous"
          cargo install --debug --locked --path "$RUNNER_TEMP/previous-src/crates/gently-cli" --root "$RUNNER_TEMP/previous"
      - name: Upgrade from the previous version, then back up and restore
        run: python3 scripts/release-check.py upgrade --previous "$RUNNER_TEMP/previous/bin/gently" --binary "$RUNNER_TEMP/release/gently"
      - name: Worker dependencies
        working-directory: worker
        run: npm ci --ignore-scripts
      - name: Real CLI, encrypted readers, Wrangler and D1 acceptance against the release binary
        run: python3 scripts/acceptance-local.py --binary "$RUNNER_TEMP/release/gently"
