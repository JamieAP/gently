name: code

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Outside submissions are data for owner review, not permission to run code.
    # Repository-level approval for ALL external contributors is also required:
    # a PR can propose changes to this workflow and remove a job-level guard.
    if: github.repository == 'JamieAP/gently' && github.actor == 'JamieAP' && (github.event_name != 'pull_request' || (github.event.pull_request.user.login == 'JamieAP' && github.event.pull_request.head.repo.full_name == 'JamieAP/gently'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_WRITE_LOGS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install stable Rust tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Rust formatting, regression tests and lint
        run: |
          cargo fmt --all -- --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Install CLI from source
        run: cargo install --debug --locked --path crates/gently-cli --root "$RUNNER_TEMP/gently-install"
      - name: Worker dependencies, tests and type checking
        working-directory: worker
        run: |
          npm ci
          npm test
          npm run typecheck
      - name: Launcher regression tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Documentation dependency and build validation
        run: |
          npm ci --prefix docs --ignore-scripts
          npm test --prefix docs
          npm run --prefix docs build
      - name: Real CLI, encrypted readers, Wrangler and D1 acceptance
        run: python3 scripts/acceptance-local.py --binary "$RUNNER_TEMP/gently-install/bin/gently"
