# Local collector only. Host authorization is supplied by the launch environment.
name = "gently-collector-local"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[secrets]
required = ["GENTLY_HOSTS"]

[[d1_databases]]
binding = "DB"
database_name = "gently"
database_id = "REPLACE_AFTER_CREATE"
